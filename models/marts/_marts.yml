version: 2

models:
  - name: time_spine_daily
    description: "Daily time spine for Semantic Layer time-based joins and aggregations."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: "Calendar day at daily granularity."
        granularity: day


  - name: dim_hubs
    description: "Hub dimension."
    columns:
      - name: hub_id
        tests: [unique, not_null]

  - name: dim_clients
    description: "Client dimension enriched with contract SLA target."
    columns:
      - name: client_id
        tests: [unique, not_null]
      - name: health
        tests:
          - accepted_values:
              arguments:
                values: ['healthy', 'watch', 'at-risk']

  - name: dim_drivers
    description: "Driver dimension enriched with home-hub city."
    columns:
      - name: driver_id
        tests: [unique, not_null]
      - name: home_hub_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_hubs')
                field: hub_id

  - name: fct_shipments
    description: "Shipment fact (grain: shipment) with touchpoint counts."
    semantic_model:
      enabled: true
    agg_time_dimension: created_at
    columns:
      - name: shipment_id
        entity:
          type: primary
          name: shipment
        tests: [unique, not_null]
      - name: client_id
        entity:
          type: foreign
          name: client
        tests:
          - relationships:
              arguments:
                to: ref('dim_clients')
                field: client_id
      - name: origin_hub_id
        entity:
          type: foreign
          name: hub
      - name: route_id
        entity:
          type: foreign
          name: route
      - name: created_at
        granularity: day
        dimension:
          type: time
      - name: delivered_at
        granularity: day
        dimension:
          type: time
      - name: client_name
        dimension:
          type: categorical
      - name: client_tier
        dimension:
          type: categorical
      - name: origin_city
        dimension:
          type: categorical
      - name: service_level
        dimension:
          type: categorical
      - name: status
        dimension:
          type: categorical
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'delayed', 'failed', 'returned']
    metrics:
      - name: shipment_count
        description: "Number of shipments created in the selected period."
        label: Shipment Count
        type: simple
        agg: count
        expr: shipment_id
      - name: on_time_shipment_count
        description: "Number of shipments classified as delivered on time."
        label: On-Time Shipment Count
        type: simple
        agg: sum_boolean
        expr: is_ontime
      - name: on_time_rate
        description: "Share of shipments classified as delivered on time."
        label: On-Time Rate
        type: ratio
        numerator: on_time_shipment_count
        denominator: shipment_count

  - name: fct_incidents
    description: "Incident fact (grain: incident) with report/work-order flags."
    columns:
      - name: incident_id
        tests: [unique, not_null]
      - name: hub_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_hubs')
                field: hub_id
      - name: incident_type
        tests:
          - accepted_values:
              arguments:
                values: ['damage', 'delay', 'accident', 'mispick', 'dispute', 'weather']

  - name: fct_account_health
    description: >
      Monthly account-health fact (grain: client-month). Surfaces the Jaffle
      Equipment decline: on-time % down, ticket/incident counts up across 2025.
    semantic_model:
      enabled: true
    agg_time_dimension: reporting_month
    columns:
      - name: account_month_key
        entity:
          type: primary
          name: account_month
        tests: [unique, not_null]
      - name: client_id
        entity:
          type: foreign
          name: client
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clients')
                field: client_id
      - name: month
        granularity: month
        dimension:
          type: time
          name: reporting_month

      - name: client_name
        dimension:
          type: categorical
      - name: tier
        dimension:
          type: categorical
      - name: health
        dimension:
          type: categorical
    metrics:
      - name: support_ticket_count
        description: "Number of support tickets opened for clients in the selected period."
        label: Support Ticket Count
        type: simple
        agg: sum
        expr: ticket_count
      - name: incident_count
        description: "Number of shipment-linked incidents for clients in the selected period."
        label: Incident Count
        type: simple
        agg: sum
        expr: incident_count
